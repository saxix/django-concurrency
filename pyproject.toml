[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "django-concurrency"
description = "Optimistic lock implementation for Django. Prevents users from doing concurrent editing"
readme = "README.md"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "sax", email = "s.apostolico@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [
  "version",
]
dependencies = []
urls.downloads = "https://github.com/saxix/django-concurrency"
urls.homepage = "https://github.com/saxix/django-concurrency"

[dependency-groups]
dev = [
  "check-manifest",
  "django-webtest",
  "mock",
  "pre-commit",
  "psycopg2-binary",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-echo",
  "pytest-pythonpath",
  "tox",
]
dj = [
  "django",
]

[tool.hatch]
build.hooks.vcs.version-file = "src/concurrency/version.py"
build.targets.sdist.ignore-vcs = true
build.targets.sdist.include = [
  "src/concurrency/**/*.*",
]
build.targets.wheel.packages = [ "src/concurrency" ]
version.source = "vcs"
raw-options = { root = "../.." }

[tool.uv]
package = true

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
  "docs",
  "manage.py",
  "tests",
]
format.preview = true
format.docstring-code-line-length = 120
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "A",
  "ANN",
  "ARG",    # Unused function argument:
  "B",
  "BLE",
  "COM812",
  "CPY",    # Missing copyright notice
  "D",      # docstring
  "DOC",    # docstring
  "EM",
  "ERA",
  "EXE",
  "FBT",
  "G",
  "N",
  "PERF",
  "PGH",
  "PLC",
  "PLR",
  "PLW",
  "PT",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "TRY",
  "UP",
]
lint.per-file-ignores."docs/conf.py" = [
  "A001",   #
  "D100",   #
  "ERA001", #
  "INP001", #
]
lint.per-file-ignores."tests/**/*.py" = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "D",
  "DJ",
  "DTZ",
  "ERA",
  "F",
  "FBT",
  "FURB",
  "INP",
  "N",
  "PGH",
  "PLC",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "PYI",
  "RUF",
  "S",
  "SIM",
  "TC",
  "UP",
]
lint.isort = { known-first-party = [ "concurrency" ] }
lint.pylint.max-args = 7
lint.pylint.max-branches = 14
lint.pylint.max-nested-blocks = 8
lint.preview = true

[tool.pyproject-fmt]
max_supported_python = "3.13"

[tool.pytest]
ini_options.django_find_project = false
ini_options.pythonpath = [ "./tests/demoapp/", "./src" ]
ini_options.DJANGO_SETTINGS_MODULE = "demo.settings"
ini_options.norecursedirs = [ "demo", ".tox" ]
ini_options.addopts = [
  "--tb=short",
  "--capture=no",
  "--echo-version=django",
  "--echo-attr=django.conf.settings.DATABASES.default.ENGINE",
  "--cov=concurrency",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-config=tests/.coveragerc",
]
ini_options.python_files = "test_*.py"
ini_options.markers = [
  "functional: mark a test as functional",
  "selenium: selenium test",
  "skip: skip test",
]

[tool.coverage]
run.branch = true
run.dynamic_context = "test_function"
run.omit = [
  "**/create_extra_permissions.py",
]
run.parallel = true
run.plugins = [
  "covdefaults",
]
run.source = [
  "adminactions",
]
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.exclude_lines = [
  "pragma: no cover",
]
report.fail_under = 80
report.show_missing = true
html.show_contexts = true
html.skip_covered = false
